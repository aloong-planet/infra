name: Check

# Credential-free checks only. Pull requests, including ones from forks, never
# reach the production environment or its secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# An explicit bash shell runs with -o pipefail, so a failing command in a
# pipeline still fails the step.
defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(awk '$1 == "terraform" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # Every stack is validated, and with it the modules it uses. A stack
      # without its own workflow would never be applied, so that fails here too.
      - name: terraform validate, per stack
        run: |
          shopt -s nullglob
          stacks=(stacks/*/)
          if (( ${#stacks[@]} == 0 )); then
            echo "No stacks under stacks/." >&2
            exit 1
          fi
          for dir in "${stacks[@]}"; do
            stack="$(basename "$dir")"
            echo "::group::$stack"
            if [[ ! -f ".github/workflows/terraform-$stack.yml" ]]; then
              echo "Stack $stack has no workflow .github/workflows/terraform-$stack.yml." >&2
              exit 1
            fi
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # Every stack with tests under tests/ runs them, against mock providers
      # and without credentials; the workers stack's tests fetch its modules
      # from GitHub. The job keeps its name, which the main ruleset requires.
      - name: terraform test, per stack with tests
        run: |
          shopt -s nullglob
          for dir in stacks/*/; do
            tests=("$dir"tests/*.tftest.hcl)
            if (( ${#tests[@]} == 0 )); then
              continue
            fi
            stack="$(basename "$dir")"
            echo "::group::$stack"
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

      # The scripts' tests under scripts/tests/ plan throwaway configurations
      # with the random provider and local state, without credentials; what they
      # apply goes only to that local state.
      - name: scripts tests
        run: |
          shopt -s nullglob
          tests=(scripts/tests/*.sh)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No scripts tests found under scripts/tests/"
            exit 1
          fi
          for test in "${tests[@]}"; do
            bash "$test"
          done
