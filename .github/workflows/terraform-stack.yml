name: Terraform stack

# Plans and applies one stack, called by that stack's own workflow
# (terraform-<stack>.yml). Both jobs run in the stack's environment, which
# requires the owner's approval for each job: once to let the plan read
# credentials, once more to apply after reading the plan. Saved plans contain
# secrets in plaintext and never leave the job that made them.
on:
  workflow_call:
    inputs:
      stack:
        description: Directory name under stacks/.
        required: true
        type: string
      environment:
        description: GitHub environment that holds the stack's credentials.
        required: true
        type: string
    # The jobs read these from the stack's environment, but only when the
    # caller passes them by name; a secret the caller does not pass is an empty
    # string here, with no error. Every stack needs the state backend's, so
    # those are required.
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      STATE_R2_ACCESS_KEY_ID:
        required: true
      STATE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: false
      REPO_SECRETS_TOKEN:
        required: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # An explicit bash shell runs with -o pipefail, so a failing command piped
    # through redact.sh still fails the step.
    defaults:
      run:
        shell: bash
        working-directory: stacks/${{ inputs.stack }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(awk '$1 == "terraform" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      # A secret a stack does not use is not passed and maps to an empty value,
      # which that stack never reads.
      - name: Plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_github_token: ${{ secrets.REPO_SECRETS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          STACK: ${{ inputs.stack }}
        run: |
          scripts="$GITHUB_WORKSPACE/scripts"
          terraform init -input=false -no-color | "$scripts/redact.sh"
          "$scripts/plan.sh" "$RUNNER_TEMP/plan.tfplan" "$RUNNER_TEMP/plan.result"
          cat "$RUNNER_TEMP/plan.result" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan: $STACK"
            echo
            echo '```'
            terraform show -no-color "$RUNNER_TEMP/plan.tfplan" | "$scripts/redact.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/plan.tfplan"

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: stacks/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(awk '$1 == "terraform" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: Apply the approved plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_github_token: ${{ secrets.REPO_SECRETS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          APPROVED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          scripts="$GITHUB_WORKSPACE/scripts"
          terraform init -input=false -no-color | "$scripts/redact.sh"
          "$scripts/apply.sh" "$APPROVED_FINGERPRINT"
