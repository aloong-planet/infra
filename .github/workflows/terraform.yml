name: Terraform

# Plan and apply run only in the production environment, which requires the
# owner's approval for each job: once to let the plan read credentials, once
# more to apply after reading the plan. Saved plans contain secrets in
# plaintext and never leave the job that made them.
on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - .terraform.lock.hcl
      - .tool-versions
      - scripts/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash shell runs with -o pipefail, so a failing command piped
# through redact.sh still fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: production
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(awk '$1 == "terraform" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: Plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_github_token: ${{ secrets.REPO_SECRETS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          terraform init -input=false -no-color | scripts/redact.sh
          scripts/plan.sh "$RUNNER_TEMP/plan.tfplan" "$RUNNER_TEMP/plan.result"
          cat "$RUNNER_TEMP/plan.result" >> "$GITHUB_OUTPUT"
          {
            echo '### Plan'
            echo
            echo '```'
            terraform show -no-color "$RUNNER_TEMP/plan.tfplan" | scripts/redact.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/plan.tfplan"

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(awk '$1 == "terraform" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: Apply the approved plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_github_token: ${{ secrets.REPO_SECRETS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          APPROVED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          terraform init -input=false -no-color | scripts/redact.sh
          scripts/apply.sh "$APPROVED_FINGERPRINT"
