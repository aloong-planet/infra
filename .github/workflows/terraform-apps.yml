name: Terraform apps

# The apps stack (stacks/apps). Plan and apply are in terraform-stack.yml.
on:
  push:
    branches: [main]
    paths:
      - stacks/apps/**.tf
      - stacks/apps/.terraform.lock.hcl
      - modules/**.tf
      - scripts/**
      - .tool-versions
      - .github/workflows/terraform-apps.yml
      - .github/workflows/terraform-stack.yml
  workflow_dispatch:

permissions:
  contents: read

# Runs of a stack are serialized, so one run's Plan and Apply never interleave
# with another's.
concurrency:
  group: terraform-apps
  cancel-in-progress: false

jobs:
  apps:
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: apps
      environment: production
    # Passed by name, so the stack gets these and nothing else. They exist only
    # in the production environment, which the called jobs run in.
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATE_R2_ACCESS_KEY_ID: ${{ secrets.STATE_R2_ACCESS_KEY_ID }}
      STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.STATE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
